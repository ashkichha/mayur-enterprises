<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="50%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#2b6cb0" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecc94b" />
      <stop offset="100%" stop-color="#d69e2e" />
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Gold Accent Ring -->
  <circle cx="256" cy="220" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />

  <!-- Water Wash Jet / Sparkles -->
  <path d="M 120 120 Q 180 150 210 180" stroke="#63b3ed" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 390 120 Q 330 150 300 180" stroke="#63b3ed" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />
  <circle cx="160" cy="140" r="12" fill="#90cdf4" />
  <circle cx="350" cy="140" r="12" fill="#90cdf4" />
  <circle cx="256" cy="100" r="14" fill="#63b3ed" />

  <!-- Bus Silhouette -->
  <!-- Main Body -->
  <rect x="156" y="150" width="200" height="150" rx="24" fill="url(#busGrad)" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.3))" />
  
  <!-- Bus Windshield -->
  <rect x="176" y="170" width="160" height="55" rx="10" fill="#2b6cb0" />
  <!-- Windshield Reflection -->
  <path d="M 186 175 L 230 175 L 210 220 L 178 220 Z" fill="#63b3ed" opacity="0.6" />

  <!-- Bus Headlights -->
  <circle cx="186" cy="255" r="12" fill="url(#goldGrad)" />
  <circle cx="326" cy="255" r="12" fill="url(#goldGrad)" />

  <!-- Bus Grille -->
  <rect x="221" y="248" width="70" height="6" rx="3" fill="#718096" />
  <rect x="221" y="258" width="70" height="6" rx="3" fill="#718096" />

  <!-- Bus Wheels -->
  <rect x="176" y="295" width="30" height="20" rx="6" fill="#1a202c" />
  <rect x="306" y="295" width="30" height="20" rx="6" fill="#1a202c" />

  <!-- App Title Banner -->
  <text x="256" y="380" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">MAYUR</text>
  <text x="256" y="415" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">ENTERPRISES</text>
  
  <text x="256" y="455" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#a0aec0" text-anchor="middle" letter-spacing="1">UPSRTC BADAUN</text>
</svg>
