name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle 8.5
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses || true

    - name: Build Debug APK
      working-directory: ./android
      run: |
        if ! gradle assembleDebug --stacktrace > ../build.log 2>&1; then
          echo "=== BUILD FAILED, PUSHING LOG ==="
          cd ..
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b build-logs
          git add build.log
          git commit -m "Capture build failure log"
          git push origin build-logs --force
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mayur_Enterprises_Badaun_APK
        path: android/app/build/outputs/apk/debug/*.apk
